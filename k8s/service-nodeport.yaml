# LAN 内の他端末から直接アクセスしたい場合のみ適用する (任意)。
#   kubectl apply -f k8s/service-nodeport.yaml
# Ollama には認証がないため、信頼できる LAN 内に限って使うこと。
apiVersion: v1
kind: Service
metadata:
  name: ollama-nodeport
  namespace: llm
spec:
  type: NodePort
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
      nodePort: 31434
