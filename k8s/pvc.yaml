apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: llm
  annotations:
    # ArgoCD の prune やアプリ削除でモデル保存領域が消えないようにする
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: ["ReadWriteOnce"]
  # storageClassName は環境のデフォルトを使用する。
  # microk8s なら hostpath-storage アドオン、minikube なら標準で有効。
  resources:
    requests:
      storage: 40Gi   # モデル保存用。モデルを増やす場合は拡張する
