apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO の PVC を使うためローリング更新は不可
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # master は低スペックなので Worker に固定する。
      # hostpath の PVC も最初にスケジュールされたノードに作られる。
      nodeSelector:
        kubernetes.io/hostname: k8s-worker
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"        # モデルをメモリに保持して再ロードを避ける
            - name: OLLAMA_NUM_PARALLEL
              value: "1"          # CPU 推論では並列数を増やすと全体が遅くなる
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"          # チャット用 + 補完用の同時ロードを想定
            - name: OLLAMA_CONTEXT_LENGTH
              value: "8192"       # 既定の 4096 では、長い会話の古い部分が警告なしに切り捨てられる (ADR-0010)
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            # Worker は 6 vCPU / 約30GB で、ArgoCD・chat-app・PostgreSQL・
            # ingress などが同居している。他の Pod を飢えさせない値にする。
            # Worker VM は 20GiB (ホストの物理メモリは 31GiB)。
            # 8B のチャットモデル (約7GB) と補完モデル (約2.5GB) の同時ロードを想定する。
            # 10Gi では同時ロード時に OOMKilled になった (ADR-0006)。
            # Worker VM を 26GiB に増設した。gpt-oss:20b (約13.5GB) と granite4.1:8b (約6.9GB) の
            # 同時ロードが最悪ケースのため、KV キャッシュと余裕を含めて 22Gi にする (ADR-0012)。
            requests:
              cpu: "3"
              memory: 8Gi
            limits:
              cpu: "5"
              memory: 22Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
