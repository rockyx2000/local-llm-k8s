apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO の PVC を使うためローリング更新は不可
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # master は低スペックなので Worker に固定する。
      # hostpath の PVC も最初にスケジュールされたノードに作られる。
      nodeSelector:
        kubernetes.io/hostname: k8s-worker
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"        # モデルをメモリに保持して再ロードを避ける
            - name: OLLAMA_NUM_PARALLEL
              value: "1"          # CPU 推論では並列数を増やすと全体が遅くなる
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"          # チャット用 + 補完用の同時ロードを想定
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            # Worker は 6 vCPU / 約30GB で、ArgoCD・chat-app・PostgreSQL・
            # ingress などが同居している。他の Pod を飢えさせない値にする。
            requests:
              cpu: "3"
              memory: 8Gi
            limits:
              cpu: "5"
              memory: 20Gi        # gpt-oss:20b (約14GB) を載せても余裕がある値
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
